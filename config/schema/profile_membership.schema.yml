profile_membership.settings:
  type: config_object
  label: 'Profile Membership settings'
  mapping:
    entrepreneurship_email_enabled:
      type: boolean
      label: 'Enable entrepreneurship follow-up email'
    send_once:
      type: boolean
      label: 'Send only once'
    regional_support_url:
      type: string
      label: 'Regional support system URL'
    trigger_goal_values:
      type: sequence
      label: 'Goal trigger values'
      sequence:
        type: string
    trigger_entrepreneurship_values:
      type: sequence
      label: 'Entrepreneurship trigger values'
      sequence:
        type: string
    entrepreneurship_email_subject:
      type: string
      label: 'Entrepreneurship email subject'
    entrepreneurship_email_body:
      type: text
      label: 'Entrepreneurship email body'

    address_campaign:
      type: mapping
      label: 'Mailing-address confirmation campaign'
      mapping:
        enabled:
          type: boolean
          label: 'Ask members to confirm their mailing address'
        start:
          type: string
          label: 'Campaign start date (Y-m-d); answers before it count as stale'
        snooze_days:
          type: integer
          label: 'Days to hide the prompt after "Not now"'
        checkin_webform:
          type: string
          label: 'Webform id for the year-end check-in answers'
