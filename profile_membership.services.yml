services:
  profile_membership.address_sync_manager:
    class: Drupal\profile_membership\Service\AddressSyncManager
    arguments:
      - '@account_switcher'
      - '@logger.factory'

  profile_membership.handoff_subscriber:
    class: Drupal\profile_membership\EventSubscriber\MembershipHandoffSubscriber
    arguments:
      - '@current_user'
      - '@entity_type.manager'
      - '@messenger'
    tags:
      - { name: event_subscriber }

  profile_membership.address_campaign:
    class: Drupal\profile_membership\Service\AddressCampaign
    arguments:
      - '@config.factory'
      - '@user.data'
      - '@account_switcher'
      - '@datetime.time'
      - '@logger.factory'
