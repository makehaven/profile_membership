profile_membership.initiate:
  path: '/membership-initiate'
  defaults:
    _controller: '\Drupal\profile_membership\Controller\MembershipController::initiate'
    _title: 'Starting Membership'
  requirements:
    # Public by design: the Chargebee return for an existing account lands
    # here before anyone is logged in, and it does nothing but look up the
    # email and send the visitor to log in.
    _access: 'TRUE'

profile_membership.finalize:
  path: '/membership-finalize'
  defaults:
    _controller: '\Drupal\profile_membership\Controller\MembershipController::finalize'
    _title: 'Membership Finalize'
  requirements:
    _user_is_logged_in: 'TRUE'

profile_membership.update_address:
  path: '/membership/address'
  defaults:
    _form: '\Drupal\profile_membership\Form\UpdateAddressForm'
    _title: 'Update Your Address'
  requirements:
    _user_is_logged_in: 'TRUE'

profile_membership.emergency_contact:
  path: '/membership/emergency-contact'
  defaults:
    _form: '\Drupal\profile_membership\Form\EmergencyContactForm'
    _title: 'Your Emergency Contact'
  requirements:
    _user_is_logged_in: 'TRUE'

profile_membership.settings:
  path: '/admin/config/makerspace/profile-membership'
  defaults:
    _form: '\Drupal\profile_membership\Form\ProfileMembershipSettingsForm'
    _title: 'Profile Membership Settings'
  requirements:
    _permission: 'administer profile membership settings'
